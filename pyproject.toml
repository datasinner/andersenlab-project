[project]
name = "port-tariff-agent"
version = "0.1.0"
description = "Agentic RAG service that reads port tariff documents and calculates the dues payable by a vessel call."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.142.2",
    "langchain==1.4.3",
    "langchain-openai==1.6.7",
    "langfuse==4.14.4",
    "langgraph==1.2.12",
    "pgvector==0.5.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pymupdf==1.28.2",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.1.1",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app.db's engine/session factory are module-level singletons (as they are
# in the running app), so their pooled asyncpg connections must stay bound
# to one event loop for the whole test session rather than pytest-asyncio's
# default per-test loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Lets tests import shared helpers as tests.unit.rule_builders.
pythonpath = ["."]
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings on import; nothing to act on.
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Alembic autogenerates these in its own template style; reformatting them
# on every `alembic revision --autogenerate` isn't practical to maintain.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/File() in argument defaults is the framework's
# documented pattern, not the mutable-default-argument bug B008 flags.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.ruff.format]
quote-style = "double"
