worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types application/json;
    gzip_min_length 256;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;

        # Matches MAX_UPLOAD_MB, so tariff PDF uploads aren't cut off here.
        client_max_body_size 25m;

        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Must exceed the app's CALCULATION_TIMEOUT_SECONDS (default 300s)
            # by a margin, or nginx cuts the connection before the app can
            # write the failure row. See BUILD_PLAN.md section 12.
            proxy_read_timeout 315s;
        }
    }
}
